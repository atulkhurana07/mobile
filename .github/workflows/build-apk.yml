name: Build Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=API_BASE_URL=https://backend-ce2c.onrender.com \
            --dart-define=WS_URL=wss://backend-ce2c.onrender.com 2>&1 | tee build.log

      - name: Push Build Log to Branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-log
          tail -n 300 build.log > latest_error.txt || true
          git add latest_error.txt
          git commit -m "chore: latest build log [skip ci]" || true
          git push origin build-log --force || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chargeease-operator-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Release (on push to main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "URJA Operator App v1.0.${{ github.run_number }}"
          body: |
            ## ?? URJA Operator Mobile Terminal - Production Release
            - Connected to live backend: `https://backend-ce2c.onrender.com`
            - Real-time WebSocket: `wss://backend-ce2c.onrender.com`
            - Full GPS mapping, battery monitoring & live vehicle telemetry
            
            ### Download APK:
            Download `app-release.apk` below and install on your Android device.
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
